// AirPlay 2 receiver for VK Capsula Mini (Amlogic A113X) on the stock
// Buildroot 2022.11.1 firmware (aarch64, glibc 2.33, PulseAudio 16.1).
//
// The stock PulseAudio graph is
//   master (virtual) -> alsa_playback (hardware)
// and voice-agent owns the "master" sink volume (its 0..100 value, which also
// drives the LED ring and the VK app). Shairport therefore does not touch the
// sink: the AirPlay volume is forwarded to voice-agent via stereoctl
// (/tmp/stereoctl.sock), exactly as on the 2019 capsule.
//
// volume_range_db must stay at the 30 dB hardware range declared by the
// patched PulseAudio backend. A larger range makes shairport switch to
// "software priority" and hand 0 dB (full volume) to the speaker.

general = {
	name = "VK Capsula Mini AirPlay";
	output_backend = "pulseaudio";
	port = 7000;
	interpolation = "basic";
	volume_range_db = 30.0;
	volume_control_profile = "flat";
	audio_backend_buffer_desired_length_in_seconds = 0.15;
	audio_backend_latency_offset_in_seconds = -1.7;
	resync_threshold_in_seconds = 0.050;
	drift_tolerance_in_seconds = 0.002;
};

diagnostics = {
	// Raise to 3 to trace the AirPlay volume bridge in the log.
	log_verbosity = 2;
};

pulseaudio = {
	// The virtual "master" sink is what the capsule's volume control drives,
	// so AirPlay audio follows the speaker volume and the phone slider both.
	output_device = "master";
};

metadata = {
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "/tmp/capsula-airplay-metadata";
	cover_art_cache_directory = "/tmp/capsula-airplay-covers";
};

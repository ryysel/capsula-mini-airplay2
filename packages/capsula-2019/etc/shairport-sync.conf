// AirPlay 2 receiver for VK Капсула 2019 (RK3308, Buildroot, glibc).
//
// Audio goes to PulseAudio. The stock graph is
//   master (virtual) -> awsm_sink (LADSPA) -> alsa_playback (hardware),
// and voice-agent owns the "master" sink volume (its own 0..100 value, which
// also drives the LED ring and the VK app). Shairport therefore does not touch
// the sink: the AirPlay volume is forwarded to voice-agent via stereoctl.
//
// volume_range_db must not exceed the 30 dB hardware range declared by the
// patched PulseAudio backend. With a larger range shairport switches to
// "software priority" and hands 0 dB (i.e. full volume) to the speaker for
// most of the slider travel.

general = {
	name = "Капсула";
	output_backend = "pulseaudio";
	port = 7000;
	interpolation = "basic";
	volume_range_db = 30.0;
	audio_backend_buffer_desired_length_in_seconds = 0.2;
};

diagnostics = {
	// Raise to 3 to trace the AirPlay volume bridge in the log.
	log_verbosity = 2;
};

pulseaudio = {
	// The virtual "master" sink is what the capsule's volume control drives,
	// so AirPlay audio follows the speaker volume and the phone slider both.
	output_device = "master";
};

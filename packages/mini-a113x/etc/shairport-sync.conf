// AirPlay 2 receiver for VK Capsula Mini (Amlogic A113X), Alpine 3.24.
// Output goes to "default" from /etc/asound.conf — a softvol on
// "Master Playback Volume" owned by capsule-tweaker. shairport-sync keeps
// its own software volume, so the phone slider and the buttons stay
// independent instead of fighting over one mixer control.

general = {
	name = "Капсула Мини";
	output_backend = "alsa";
	interface = "wlan0";
	port = 7000;
	interpolation = "basic";
	volume_range_db = 60.0;
	audio_backend_buffer_desired_length_in_seconds = 0.2;
};

alsa = {
	output_device = "default";
	output_rate = 48000;
	output_format = "S16_LE";
};
